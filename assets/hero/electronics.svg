<?xml version="1.0" encoding="UTF-8"?>
<!--
  ZeRo-RX animated electronics hero  (v2 - stylized-realistic ESP32 DevKit)
  =========================================================================
  Self-contained, JS-free animated SVG for a GitHub Profile README.

  Physical circuit (assemblable on a breadboard):
     ESP32 GPIO 2  -> orange jumper -> R1 (220 ohm) -> jumper -> LED1 -> GND
     ESP32 GND     -> blue jumper   -> breadboard GND rail  (common ground)

  Visual story, looping every 3s:
     ESP32 executes code  ->  GPIO 2 goes HIGH  ->  a current pulse travels
     along the real jumper wire, THROUGH resistor R1, to LED1  ->  LED1 turns
     ON  ->  GPIO 2 goes LOW  ->  LED1 turns OFF  ->  repeat.

  Animated components (keep these ids when editing):
     #esp32       - the ESP32 DevKit board (with a blinking blue user LED)
     #gpio-wire   - the visible conductor path GPIO2 -> R1 -> LED1 (also the
                    <mpath> followed by the signal pulses)
     #gpio-flow   - dashed overlay = continuous current flow
     #pulse1/#pulse2 - bright signal pulses travelling ESP32 -> R1 -> LED1
     #led         - LED1 body (fill animates OFF <-> ON)
     #led-glow    - LED1 halo (opacity animates with the blink)
     #led-core    - small bright core highlight (ON only)
     #scope-wave  - oscilloscope trace of the GPIO 2 signal (square wave)
     #resistor    - R1, physically inline in the LED current path

  Animation: SMIL only. No JavaScript. Works via <img src="..."> in a README.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 520" width="1200" height="520" role="img"
     aria-label="ZeRo-RX animated electronics workspace: an ESP32 DevKit driving a blinking LED through a 220 ohm resistor on a breadboard">

  <!-- ========================= DEFS ========================= -->
  <defs>
    <radialGradient id="bgGrad" cx="32%" cy="28%" r="95%">
      <stop offset="0%"  stop-color="#0b1620"/>
      <stop offset="60%" stop-color="#070d13"/>
      <stop offset="100%" stop-color="#04080c"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#0f1d25" stroke-width="1"/>
    </pattern>

    <!-- metal header pins (vertical rows) -->
    <pattern id="vpin" width="16" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="10" height="9" rx="1" fill="#c9ced4" stroke="#7d858d" stroke-width="0.8"/>
    </pattern>

    <!-- breadboard holes -->
    <pattern id="bh" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.8" fill="#16262f"/>
    </pattern>

    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0f3a2c"/>
      <stop offset="100%" stop-color="#0a2419"/>
    </linearGradient>

    <linearGradient id="bbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d1c25"/>
      <stop offset="100%" stop-color="#08131a"/>
    </linearGradient>

    <linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#dfe4e9"/>
      <stop offset="100%" stop-color="#aab2bb"/>
    </linearGradient>

    <linearGradient id="usbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#cfd6dd"/>
      <stop offset="100%" stop-color="#8a929b"/>
    </linearGradient>

    <radialGradient id="ledGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%"  stop-color="#ffd2cc"/>
      <stop offset="35%" stop-color="#ff5a4d"/>
      <stop offset="100%" stop-color="#7a120c"/>
    </radialGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff6a5a" stop-opacity="0.9"/>
      <stop offset="45%"  stop-color="#ff3b30" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scopeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#06170f"/>
      <stop offset="100%" stop-color="#04100a"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ========================= BACKGROUND ========================= -->
  <rect x="0" y="0" width="1200" height="520" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="520" fill="url(#grid)" opacity="0.4"/>

  <!-- faint, subtle decorative PCB traces (lowest visual priority) -->
  <g stroke="#103021" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M0 470 C160 470 240 430 420 430"/>
    <path d="M1100 40 C1000 60 940 90 860 90"/>
  </g>

  <!-- ========================= TITLE / BRANDING ========================= -->
  <text x="600" y="46" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="44" font-weight="700" fill="#4dd0e1" letter-spacing="3"
        filter="url(#softGlow)">ZeRo-RX</text>
  <text x="600" y="80" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="20" fill="#8aa0a8" letter-spacing="2">Electronics • Embedded Systems • Python • AI</text>

  <!-- ========================= ESP32 DEVKIT BOARD ========================= -->
  <g id="esp32">
    <!-- PCB body -->
    <rect x="90" y="70" width="190" height="362" rx="10" fill="url(#boardGrad)"
          stroke="#1c4a36" stroke-width="2"/>
    <!-- two rows of metal header pins along the sides -->
    <rect x="104" y="108" width="16" height="300" fill="url(#vpin)"/>
    <rect x="250" y="108" width="16" height="300" fill="url(#vpin)"/>

    <!-- ESP-WROOM-32 RF module (metal shield, upper portion) -->
    <rect x="145" y="96" width="90" height="80" rx="5" fill="url(#chipGrad)" stroke="#7c858f"/>
    <rect x="153" y="104" width="74" height="64" rx="3" fill="#1c2228"/>
    <text x="190" y="132" text-anchor="middle" font-family="monospace" font-size="13"
          font-weight="700" fill="#cdd5dd">ESP32</text>
    <text x="190" y="148" text-anchor="middle" font-family="monospace" font-size="9"
          fill="#8a929b">WROOM-32</text>
    <!-- antenna hint on the module edge -->
    <rect x="139" y="120" width="6" height="34" rx="2" fill="#aab2bb" opacity="0.6"/>

    <!-- USB connector at the bottom -->
    <rect x="150" y="424" width="70" height="16" rx="2" fill="url(#usbGrad)" stroke="#6c747c"/>
    <rect x="158" y="429" width="54" height="6" rx="1.5" fill="#0c0f12"/>
    <text x="185" y="460" text-anchor="middle" font-family="monospace" font-size="9"
          fill="#5f7a86">USB</text>

    <!-- EN / BOOT buttons -->
    <circle cx="150" cy="408" r="7" fill="#27313a" stroke="#11161b"/>
    <circle cx="222" cy="408" r="7" fill="#27313a" stroke="#11161b"/>
    <text x="150" y="398" text-anchor="middle" font-family="monospace" font-size="9" fill="#5f7a86">EN</text>
    <text x="222" y="398" text-anchor="middle" font-family="monospace" font-size="9" fill="#5f7a86">BOOT</text>

    <!-- small onboard blue user LED (blinks to show the MCU is running) -->
    <circle cx="190" cy="340" r="5" fill="#3aa0ff" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="200" y="344" font-family="monospace" font-size="9" fill="#5f7a86">IO2</text>

    <!-- silkscreen labels -->
    <text x="86" y="124" font-family="monospace" font-size="9" fill="#7fae9c">3V3</text>
    <text x="84" y="214" font-family="monospace" font-size="9" fill="#7fae9c">GPIO34</text>
    <text x="86" y="304" font-family="monospace" font-size="9" fill="#7fae9c">GND</text>
    <text x="276" y="118" font-family="monospace" font-size="9" fill="#7fae9c">3V3</text>

    <!-- GPIO 2 pin (highlighted) on the right header -->
    <rect x="250" y="194" width="16" height="12" rx="2" fill="#ff5a4d" stroke="#7a1d16"/>
    <text x="276" y="204" font-family="monospace" font-size="13" font-weight="700" fill="#ff8a7d">GPIO 2</text>

    <!-- GND pin (highlighted) on the right header -->
    <rect x="250" y="334" width="16" height="12" rx="2" fill="#3b6fb5" stroke="#16335c"/>
    <text x="276" y="344" font-family="monospace" font-size="12" font-weight="700" fill="#7fb0e8">GND</text>

    <text x="185" y="92" text-anchor="middle" font-family="monospace" font-size="11"
          font-weight="700" fill="#bfe6d8" opacity="0.85">ESP32</text>
  </g>

  <!-- ========================= BREADBOARD ========================= -->
  <g id="breadboard">
    <rect x="470" y="255" width="620" height="205" rx="12" fill="url(#bbGrad)"
          stroke="#1d3340" stroke-width="1.5"/>
    <rect x="470" y="255" width="620" height="205" rx="12" fill="url(#bh)" opacity="0.85"/>
    <!-- center trench between the two terminal strips -->
    <rect x="478" y="353" width="604" height="8" rx="2" fill="#050c11"/>
    <!-- power rails -->
    <rect x="478" y="262" width="604" height="13" rx="2" fill="#0a161d"/>
    <line x1="486" y1="268" x2="1074" y2="268" stroke="#c0392b" stroke-width="1.6"/>
    <text x="486" y="277" font-family="monospace" font-size="9" fill="#c0392b">3V3 / 5V</text>
    <rect x="478" y="440" width="604" height="13" rx="2" fill="#0a161d"/>
    <line x1="486" y1="447" x2="1074" y2="447" stroke="#2f6fb0" stroke-width="1.6"/>
    <text x="486" y="456" font-family="monospace" font-size="9" fill="#3b6fb5">GND</text>
    <!-- terminal-strip holes (drawn over the trench gap region edges) -->
    <g fill="#16262f">
      <circle cx="510" cy="300" r="2"/><circle cx="560" cy="300" r="2"/>
      <circle cx="640" cy="300" r="2"/><circle cx="820" cy="300" r="2"/>
      <circle cx="510" cy="410" r="2"/><circle cx="560" cy="410" r="2"/>
      <circle cx="640" cy="410" r="2"/><circle cx="820" cy="410" r="2"/>
      <circle cx="845" cy="447" r="2"/>
    </g>
  </g>

  <!-- ========================= GND RETURN WIRE (static) ========================= -->
  <!-- ESP32 GND pin -> breadboard GND rail (common ground) -->
  <path d="M266,340 C360,345 430,402 520,447" fill="none" stroke="#2f6fb0"
        stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- ========================= MAIN CIRCUIT WIRE (GPIO2 -> R1 -> LED1) ========================= -->
  <!-- visible conductor -->
  <path id="gpio-wire" class="pcb-trace"
        d="M266,200 C360,205 430,250 520,300 L560,330 L640,330 L820,345 L845,361"
        fill="none" stroke="#e08a3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- animated dashed overlay = continuous current flow -->
  <path id="gpio-flow"
        d="M266,200 C360,205 430,250 520,300 L560,330 L640,330 L820,345 L845,361"
        fill="none" stroke="#ffd24a" stroke-width="2.4"
        stroke-dasharray="2 14" stroke-linecap="round" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="0.9s" repeatCount="indefinite"/>
  </path>

  <!-- ========================= RESISTOR R1 (inline) ========================= -->
  <g id="resistor">
    <!-- leads plug into the wire at (560,330) and (640,330) -->
    <line x1="548" y1="330" x2="560" y2="330" stroke="#c9ced4" stroke-width="2.5"/>
    <line x1="640" y1="330" x2="652" y2="330" stroke="#c9ced4" stroke-width="2.5"/>
    <!-- axial body -->
    <rect x="560" y="318" width="80" height="24" rx="5" fill="#d9c2a6" stroke="#9c8a6f" stroke-width="1.2"/>
    <!-- colour bands (220 ohm: red red brown) -->
    <rect x="572" y="318" width="5" height="24" fill="#c0392b"/>
    <rect x="582" y="318" width="5" height="24" fill="#c0392b"/>
    <rect x="592" y="318" width="5" height="24" fill="#6b4423"/>
    <rect x="616" y="318" width="5" height="24" fill="#b5892f"/>
    <text x="600" y="311" text-anchor="middle" font-family="monospace" font-size="11"
          font-weight="700" fill="#d9c2a6">R1</text>
    <text x="600" y="356" text-anchor="middle" font-family="monospace" font-size="10"
          fill="#caa23a">220Ω</text>
  </g>

  <!-- ========================= SIGNAL PULSES (follow #gpio-wire) ========================= -->
  <circle id="pulse1" r="6" fill="#fff3b0" filter="url(#softGlow)">
    <animateMotion dur="3s" repeatCount="indefinite" calcMode="linear"
                  keyTimes="0;0.13;0.30;1" keyPoints="0;1;1;1">
      <mpath xlink:href="#gpio-wire"/>
    </animateMotion>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
             keyTimes="0;0.01;0.13;0.30;0.31;1" values="0;1;1;0;0;0"/>
  </circle>
  <circle id="pulse2" r="6" fill="#fff3b0" filter="url(#softGlow)">
    <animateMotion dur="3s" repeatCount="indefinite" calcMode="linear"
                  keyTimes="0;0.33;0.48;1" keyPoints="0;0;1;1">
      <mpath xlink:href="#gpio-wire"/>
    </animateMotion>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
             keyTimes="0;0.32;0.33;0.48;0.49;1" values="0;0;1;1;0;0"/>
  </circle>

  <!-- ========================= LED1 ========================= -->
  <g id="led-group">
    <!-- cathode lead -> GND rail -->
    <line x1="845" y1="399" x2="845" y2="447" stroke="#c9ced4" stroke-width="2.5"/>
    <!-- halo / glow (subtle, centred on the LED) -->
    <circle id="led-glow" cx="845" cy="375" r="34" fill="url(#glowGrad)">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
               keyTimes="0;0.13;0.33;0.48;0.67;1" values="0;1;0;1;0;0"/>
    </circle>
    <!-- LED body (fill animates OFF <-> ON) -->
    <circle id="led" cx="845" cy="375" r="24" fill="url(#ledGrad)"
            stroke="#3a0d0d" stroke-width="2">
      <animate attributeName="fill" dur="3s" repeatCount="indefinite"
               keyTimes="0;0.13;0.33;0.48;0.67;1"
               values="#3a0d0d;#ff3b30;#3a0d0d;#ff3b30;#3a0d0d;#3a0d0d"/>
    </circle>
    <!-- bright core highlight (ON only) -->
    <circle id="led-core" cx="838" cy="368" r="8" fill="#fff4f0" opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
               keyTimes="0;0.13;0.33;0.48;0.67;1" values="0;0.9;0;0.9;0;0"/>
    </circle>
    <!-- cathode flat marker -->
    <path d="M833 391 L839 391" stroke="#2a0808" stroke-width="3" stroke-linecap="round"/>
    <text x="845" y="416" text-anchor="middle" font-family="monospace"
          font-size="12" fill="#ff8a7d">LED1</text>
  </g>

  <!-- ========================= OSCILLOSCOPE (GPIO 2 SIGNAL) ========================= -->
  <g id="scope">
    <rect x="870" y="100" width="280" height="140" rx="9" fill="url(#scopeGrad)"
          stroke="#0e3a2a" stroke-width="2"/>
    <g stroke="#0f3a26" stroke-width="1" opacity="0.8">
      <line x1="890" y1="150" x2="1140" y2="150"/>
      <line x1="890" y1="180" x2="1140" y2="180"/>
      <line x1="890" y1="210" x2="1140" y2="210"/>
      <line x1="960" y1="106" x2="960" y2="234"/>
      <line x1="1030" y1="106" x2="1030" y2="234"/>
      <line x1="1100" y1="106" x2="1100" y2="234"/>
    </g>
    <!-- GPIO 2 square wave: HIGH exactly during the LED ON windows -->
    <polyline id="scope-wave"
              points="890,210 923,210 923,150 973,150 973,210 1008,210 1008,150 1058,150 1058,210 1140,210"
              fill="none" stroke="#4be39a" stroke-width="2.5"
              stroke-linejoin="round" filter="url(#softGlow)"/>
    <!-- sweeping playhead -->
    <line x1="890" y1="106" x2="890" y2="234" stroke="#7affc4" stroke-width="1.5" opacity="0.7">
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="250 0" dur="3s" repeatCount="indefinite"/>
    </line>
    <text x="876" y="94" font-family="monospace" font-size="12" fill="#4be39a">GPIO 2 · SIGNAL</text>
  </g>

  <!-- ========================= CAPTION ========================= -->
  <text x="600" y="506" text-anchor="middle" font-family="'Segoe UI',sans-serif"
        font-size="15" fill="#5f7a86" letter-spacing="1">
    ESP32  →  GPIO 2  →  R1 (220Ω)  →  LED1  →  GND   ·   code executes · signal travels · LED blinks
  </text>
</svg>
